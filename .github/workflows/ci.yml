name: CI

# CI M1: prove every relevant push/PR still builds and passes tests. This
# workflow does NOT publish anything - no GitHub Release, no tag, no VSIX
# marketplace publish. Artifacts produced/uploaded here are CI build
# output for inspection only, never an official KAI release (see the
# "compiler" job's upload-artifact step below for the exact naming
# distinction from a real vX.Y.Z release asset).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch: {}

# Least-privilege token: this workflow only reads the repository (checkout,
# build, test). It never pushes commits/tags, creates releases, or
# publishes packages, so it never needs "contents: write" or any other
# elevated scope.
permissions:
  contents: read

# Cancel a superseded run for the same ref (e.g. a PR that received a new
# push) instead of letting redundant runs keep going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds KAI-CC exactly the way the portable Linux x86_64 release does -
  # reusing release/linux-x86_64/Containerfile and
  # scripts/build-release-linux-x86_64.sh rather than re-deriving a second,
  # separate LLVM 22 + Ubuntu 22.04 apt-get recipe in this YAML file. This
  # keeps the LLVM/Z3/toolchain setup knowledge in exactly one place. The
  # script already performs: containerized configure -> build -> full
  # CTest suite (including native_compilation_tests, which exercises the
  # real .kai -> object -> host linker -> executable -> run pipeline) ->
  # cmake install -> curated example compile/run checks -> portable
  # tarball creation. Nothing here duplicates those checks.
  compiler:
    name: Compiler (Linux x86_64 portable release build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test, and package the portable Linux x86_64 release
        run: scripts/build-release-linux-x86_64.sh

      - name: Upload CI build artifact (not an official KAI release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # Upload the unpacked staging tree (dist/kai-linux-x86_64/),
          # never the versioned tarball the script also produces
          # (dist/kai-<version>-linux-x86_64.tar.gz) - that filename
          # matches an official GitHub Release asset (e.g.
          # kai-0.1.0-alpha.1-linux-x86_64.tar.gz), and uploading it here
          # would make an arbitrary CI build on master/a PR look like that
          # release. actions/upload-artifact zips this tree itself, so no
          # second repackaging step is needed. The artifact name is
          # explicitly CI-scoped and carries no version string.
          name: kai-cc-ci-linux-x86_64-${{ github.sha }}
          path: dist/kai-linux-x86_64/
          if-no-files-found: error
          retention-days: 7

  # WINDOWS M1 proved the SAME source tree builds and runs its CTest
  # suite natively on Windows x86_64 (a portability BASELINE). WINDOWS
  # PORTABLE PACKAGE M2 evolves this SAME job into build -> test ->
  # package (spec §24 option A), rather than adding a second
  # `windows-package` job that would need its own `msys2/setup-msys2`
  # environment (the actual expensive part of a Windows CI job - package
  # downloads/installation - not the C++ build itself) - see this job's
  # own "Build, test, and package" step below, which now does everything
  # the old separate configure/build/ctest/smoke-test/DLL-report steps
  # did, and more (install, curated-example verification against the
  # INSTALLED tree, full recursive DLL closure), via
  # scripts/build-release-windows-x86_64.sh - the SAME script a
  # maintainer runs locally (spec §26: never a CI-only build recipe).
  # Independent of the "compiler" job above - it builds its own fresh
  # kaicc.exe on windows-latest rather than reusing the Linux job's
  # artifact, since the two are different native binaries for different
  # host triples.
  #
  # Exactly one Windows toolchain baseline (WINDOWS M1 spec §2): MSYS2
  # UCRT64 with LLVM/Clang 22.1.8, never MSVC and never WSL - WSL is a
  # Linux userspace inside Windows, not a test of KAI-CC's own Windows
  # portability, and a second (MSVC) configuration is explicitly out of
  # scope for this milestone.
  #
  # No GitHub Release is published here (spec §24/§30) - this job's own
  # upload-artifact step below is explicitly CI-scoped, exactly like the
  # "compiler" job's Linux artifact.
  compiler-windows:
    name: Compiler (Windows x86_64 build/test/package)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Every step below runs inside the MSYS2 UCRT64 shell that
        # msys2/setup-msys2@v2 installs - never Windows' own cmd.exe/
        # PowerShell - so PATH already contains exactly the UCRT64
        # toolchain this job just installed, with no manual PATH surgery.
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Deliberately narrow (WINDOWS M1 spec §13: "verify actual
          # package requirements rather than blindly installing all of
          # them") - not the entire UCRT64 package set:
          #   toolchain    - gcc/g++/make/binutils: the host C toolchain
          #                  NativeLinker searches for (cc/clang/gcc) to
          #                  invoke as the final native link step, and a
          #                  second working driver besides clang itself
          #   clang        - the Clang 22.1.8 frontend, used to BUILD
          #                  kaicc/kai_compiler/kai_runtime themselves
          #   llvm         - LLVM 22.1.8 + llvm-config + LLVMConfig.cmake,
          #                  the actual codegen/object-emission backend
          #                  kai_compiler links against (find_package(LLVM
          #                  CONFIG REQUIRED) in the root CMakeLists.txt)
          #   cmake, ninja - the build system (CMakeLists.txt is unforked
          #                  between platforms - WINDOWS M1 spec §4)
          #   z3           - only actually bundled by kai-cc's own CMake
          #                  Z3-detection block if LLVMSupport was built
          #                  against it (see CMakeLists.txt's own "RELEASE
          #                  HARDENING M1.1" comment); installed here so
          #                  that detection has something real to find if
          #                  this UCRT64 LLVM build does depend on it -
          #                  never assumed, only audited (WINDOWS M1
          #                  spec §10/§17)
          # `zip`/`unzip` are MSYS2 BASE packages (no
          # mingw-w64-ucrt-x86_64- prefix - see
          # scripts/build-release-windows-x86_64.sh's own header comment)
          # - `zip` produces the release archive, `unzip` is used only by
          # this job's own clean-directory smoke-test step below.
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-z3
            zip
            unzip

      - name: Build, test, and package the portable Windows x86_64 release
        # WINDOWS PORTABLE PACKAGE M2: configures a Release build, builds,
        # runs the full CTest suite (including native_compilation_tests -
        # the real .kai -> object -> host linker -> .exe -> execute
        # pipeline, with the WINDOWS M1.1 LF-only stdout fix), installs to
        # dist/kai-windows-x86_64/, verifies the curated examples AND the
        # semantic-tooling commands from that installed tree, computes the
        # recursive non-system DLL closure, and produces the versioned
        # .zip + its SHA-256. See that script's own header comment for the
        # full list of what it produces.
        run: scripts/build-release-windows-x86_64.sh

      - name: Clean-directory smoke test of the produced ZIP (sanitized PATH)
        # WINDOWS PORTABLE PACKAGE M2 spec §16/§17: extracts the ACTUAL
        # produced .zip into a fresh directory outside the repo/build
        # tree, then runs from there with $MINGW_PREFIX/bin deliberately
        # removed from PATH - proving kaicc.exe itself (starting up,
        # resolving its own bundled DLLs from bin/, locating
        # ../lib/kai/libkai_runtime.a, and every semantic-query command)
        # needs no LLVM/MSYS2 installation. The host linker is
        # INTENTIONALLY re-added to PATH only for the two steps that
        # actually compile a .kai file (spec §15/§29: linking a compiled
        # KAI program still needs a host C toolchain, exactly like the
        # Linux release - this is not hidden, it is the one explicitly
        # documented remaining requirement).
        run: |
          set -e
          KAICC_VERSION="$(./dist/kai-windows-x86_64/bin/kaicc.exe --version | awk '{print $2}')"
          ZIP_PATH="dist/kai-${KAICC_VERSION}-windows-x86_64.zip"
          SMOKE_DIR="${RUNNER_TEMP}/kai-windows-smoke"
          rm -rf "${SMOKE_DIR}"
          mkdir -p "${SMOKE_DIR}"
          unzip -q "${ZIP_PATH}" -d "${SMOKE_DIR}"
          PKG="${SMOKE_DIR}/kai-windows-x86_64"

          SANITIZED_PATH="/usr/bin:/bin"
          echo "== sanitized PATH (no \$MINGW_PREFIX/bin): ${SANITIZED_PATH} =="

          echo "-- kaicc.exe --version --"
          PATH="${SANITIZED_PATH}" "${PKG}/bin/kaicc.exe" --version

          echo "-- kaicc.exe --help --"
          PATH="${SANITIZED_PATH}" "${PKG}/bin/kaicc.exe" --help >/dev/null

          check_smoke_example() {
              local name="$1" bin="$2" expected="$3"
              PATH="${SANITIZED_PATH}:${MINGW_PREFIX}/bin" "${PKG}/bin/kaicc.exe" \
                  "${PKG}/examples/${name}" -o "${SMOKE_DIR}/${bin}"
              test -f "${SMOKE_DIR}/${bin}.exe"
              local actual
              actual="$(PATH="${SANITIZED_PATH}" "${SMOKE_DIR}/${bin}.exe")"
              if [ "${actual}" != "${expected}" ]; then
                  echo "error: ${name} smoke test produced unexpected output" >&2
                  printf "  expected: %s\n" "${expected}" >&2
                  printf "  actual:   %s\n" "${actual}" >&2
                  exit 1
              fi
              echo "  ${name}: OK"
          }

          echo "-- compile + run curated examples (host linker re-added to PATH) --"
          check_smoke_example "hello.kai" "hello" "$(printf 'Hello from KAI')"
          check_smoke_example "functions.kai" "functions" "$(printf 'Hello\nKAI\n42\n84')"
          check_smoke_example "conditions.kai" "conditions" "$(printf 'adult\npositive\nnegative\nzero')"
          check_smoke_example "variables.kai" "variables" "$(printf 'KAI\n0.1\n2026\n1')"

          echo "-- semantic tooling smoke (sanitized PATH) --"
          PATH="${SANITIZED_PATH}" "${PKG}/bin/kaicc.exe" inspect "${PKG}/examples/functions.kai" --json \
              | grep -q '"kind":"function"'
          PATH="${SANITIZED_PATH}" "${PKG}/bin/kaicc.exe" references "${PKG}/examples/functions.kai" \
              --line 15 --column 13 --json | grep -q '"line"'
          PATH="${SANITIZED_PATH}" "${PKG}/bin/kaicc.exe" call-graph "${PKG}/examples/functions.kai" --json \
              | grep -q '"add"'

          echo "All clean-directory smoke checks passed."

      - name: Upload CI build artifact (not an official KAI release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # Same convention as the "compiler" job's Linux artifact above:
          # the unpacked staging tree, never the versioned .zip (that
          # filename pattern is reserved for an official GitHub Release
          # asset) - explicitly CI-scoped name, no version string.
          name: kai-windows-x86_64-ci-${{ github.sha }}
          path: dist/kai-windows-x86_64/
          if-no-files-found: error
          retention-days: 7

  # AI-NATIVE BENCHMARK - ISOLATION M1/M2/M3A: validates the containerized
  # trial sandbox (network-disabled, non-root, read-only rootfs, no
  # repo/HOME mount, safe result collection), the enforced condition-
  # specific tool boundary (raw kaicc never sandbox-visible; a host-side
  # broker is the actual enforcement point, not wrapper naming), and the
  # provider-neutral agent-orchestration layer (exercised only by a
  # deterministic, offline ScriptedAdapter - no real model provider, no
  # API credentials, no network call to any provider). This is
  # infrastructure validation only - it runs no formal agent trial and
  # produces no benchmark score. `needs: compiler` because it reuses the
  # SAME commit's freshly-built portable compiler artifact (never the
  # official vX.Y.Z release asset) rather than re-deriving a second build
  # recipe. GitHub-hosted Ubuntu runners provide Docker (not Podman) - a
  # prior PR already confirmed the Docker path green for the M1/M2 steps
  # above; the M3A step is new in THIS change and has so far only been
  # verified locally on Fedora/rootless Podman - this PR's own run is
  # what actually validates it under Docker for the first time.
  benchmark-isolation:
    name: AI-native benchmark isolation (M1/M2/M3A)
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the compiler job's portable artifact (same commit, not a release)
        uses: actions/download-artifact@v4
        with:
          name: kai-cc-ci-linux-x86_64-${{ github.sha }}
          path: dist/kai-linux-x86_64

      - name: Restore executable permission on the staged compiler
        # GitHub Actions artifact upload/download does not reliably
        # preserve every Unix file mode bit. This restores +x ONLY on
        # this workflow's own downloaded COPY under dist/ - it never
        # touches, and cannot affect, the official release artifact,
        # which is built and published entirely separately by the
        # repository owner.
        run: chmod +x dist/kai-linux-x86_64/bin/kaicc

      - name: Run Isolation M1 tests (filesystem/network sandbox, safe collection)
        run: benchmarks/ai-native/v1/scripts/test-isolation.sh

      - name: Run Isolation M2 tests (enforced tool boundary)
        run: benchmarks/ai-native/v1/scripts/test-tool-boundary.sh --compiler-root dist/kai-linux-x86_64

      - name: Run Agent Adapter M3A tests (deterministic ScriptedAdapter orchestration)
        # Deterministic and offline - no provider network/API credentials
        # needed, no real model contacted, no formal trial run. Eligible
        # for this same job precisely because of that (see M3A's own
        # instructions).
        run: benchmarks/ai-native/v1/scripts/test-agent-adapter.py --compiler-root dist/kai-linux-x86_64

  # Independent of the compiler job - it does not need a real kaicc build,
  # so it must not wait on one. Uses the committed package-lock.json via
  # `npm ci` (never `npm install`) for a reproducible dependency tree.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test
