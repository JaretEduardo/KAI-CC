<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- KAI extension icon - an original, simple geometric "K" monogram.
       Kept to plain flat shapes (rect/polygon) only, no gradients or
       filters, so it rasterizes identically everywhere this is
       regenerated to PNG for package.json's "icon" field. -->
  <rect width="256" height="256" rx="56" fill="#10122A"/>
  <rect x="88" y="64" width="32" height="128" fill="#4FD1C5"/>
  <polygon points="120,128 120,104 208,64 184,64" fill="#4FD1C5"/>
  <polygon points="120,128 120,152 208,192 184,192" fill="#4FD1C5"/>
</svg>
